spring.application.name=farmmind-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/farmmind}
spring.datasource.username=${DATABASE_USERNAME:farmmind}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
farmmind.ai-url=${AI_SERVICE_URL:http://localhost:8000}

farmmind.upload-dir=${FARMMIND_UPLOAD_DIR:uploads}



