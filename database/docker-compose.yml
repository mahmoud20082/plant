services:
  postgres:
    image: postgres:16-alpine
    container_name: farmmind-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmmind}
      POSTGRES_USER: ${POSTGRES_USER:-farmmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - farmmind_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmmind} -d ${POSTGRES_DB:-farmmind}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  farmmind_data:
